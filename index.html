<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OmniCalc Pro | Premium Multi-Tool Suite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f5b041'><path d='M21,5H3V7H21V5M21,11H3V13H21V11M21,17H3V19H21V17M13,3L16,6L13,9V3Z'/></svg>">
</head>
<body>
    <div class="app-wrapper">
        <!-- DASHBOARD / CATEGORY PANEL -->
        <aside class="dashboard">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-calculator"></i></div>
                <h2>Omni<span>Calc</span></h2>
                <p class="brand-tag">multi-tool studio</p>
            </div>
            <nav class="calc-nav">
                <button class="nav-btn active" data-tool="currency">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Currency</span>
                </button>
                <button class="nav-btn" data-tool="length">
                    <i class="fas fa-ruler-combined"></i>
                    <span>Length</span>
                </button>
                <button class="nav-btn" data-tool="area">
                    <i class="fas fa-square"></i>
                    <span>Area</span>
                </button>
                <button class="nav-btn" data-tool="volume">
                    <i class="fas fa-cube"></i>
                    <span>Volume</span>
                </button>
                <button class="nav-btn" data-tool="weight">
                    <i class="fas fa-weight-hanging"></i>
                    <span>Weight</span>
                </button>
                <button class="nav-btn" data-tool="temperature">
                    <i class="fas fa-thermometer-half"></i>
                    <span>Temp</span>
                </button>
                <button class="nav-btn" data-tool="numbersystem">
                    <i class="fas fa-code"></i>
                    <span>Number System</span>
                </button>
            </nav>
            <div class="dashboard-footer">
                <a href="https://github.com/shahrishabh1513-jsk" target="_blank" class="github-link">
                    <i class="fab fa-github"></i> shahrishabh1513
                </a>
            </div>
        </aside>

        <!-- MAIN CARD CONTENT (DYNAMIC) -->
        <main class="calculator-panel">
            <div class="dynamic-card" id="dynamicCard">
                <div class="card-header-dynamic">
                    <div class="hero-icon"><i class="fas fa-globe-americas"></i></div>
                    <h1 id="toolTitle">Currency Converter</h1>
                    <p id="toolSubtitle">Real-time exchange · live rates</p>
                </div>
                <div id="toolInterface" class="tool-interface">
                    <!-- JS will inject active tool UI -->
                </div>
            </div>
            <div class="copyright-footer">
                <span>© 2026 | RT1504</span>
                <span class="sep">•</span>
                <a href="https://github.com/shahrishabh1513-jsk" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                <span class="sep">•</span>
                <span>OmniCalc Pro</span>
            </div>
        </main>
    </div>

    <script src="./JS/codes.js"></script>
    <script src="./JS/script.js"></script>
</body>
</html>
